[project]
name = "pts-trading-core"
version = "0.1.0"
description = "Personal Trading System — Core Engine"
requires-python = ">=3.11"
dependencies = [
    "nats-py>=2.7.0",
    "redis[hiredis]>=5.0.0",
    "clickhouse-connect>=0.7.0",
    "httpx>=0.27.0",
    "websockets>=12.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "prometheus-client>=0.20.0",
    "python-dotenv>=1.0.0",
    "orjson>=3.9.0",
]

[project.scripts]
pts = "pts.main:run"
