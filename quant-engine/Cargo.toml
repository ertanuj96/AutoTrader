[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/regime",
    "crates/trend",
    "crates/reversal",
    "crates/movement",
    "crates/signal",
    "crates/executor",
    "crates/engine-runner",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["AutoTrader Contributors"]
license = "MIT"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# NATS client
async-nats = "0.38"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Math / linear algebra
nalgebra = "0.33"
ndarray = "0.16"
statrs = "0.18"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Config
config = "0.14"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Error handling
anyhow = "1"
thiserror = "2"

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# Async futures
futures = "0.3"

# ── Test utilities (dev-only, shared) ──
proptest = "1"
approx = "0.5"
